<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Doc Sync</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 760px; margin: 40px auto; padding: 0 20px;
         color: #16202b; background: #f3f5f7; }
  h1 { font-size: 22px; }
  nav { margin-bottom: 28px; }
  nav a { margin-right: 18px; font-weight: 600; color: #2f6fed; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
  label span.hint { font-weight: 400; color: #516170; }
  input, textarea, select { width: 100%; padding: 9px 10px; margin-top: 5px; font-size: 14px;
                     border: 1px solid #c7d0d9; border-radius: 6px; box-sizing: border-box;
                     font-family: inherit; }
  select { background: white; }
  textarea { min-height: 54px; resize: vertical; }
  button { margin-top: 22px; padding: 10px 20px; background: #2f6fed; color: white;
           border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .card { background: white; border: 1px solid #c7d0d9; border-left-width: 4px;
          border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  .pending { border-left-color: #2f6fed; }
  .merge_conflict { border-left-color: #b5720a; }
  .no_action { border-left-color: #8a97a4; }
  .status { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em;
            text-transform: uppercase; color: #516170; margin-bottom: 6px; }
  .btn-row { margin-top: 12px; }
  .btn-row form { display: inline-block; margin-right: 8px; }
  .btn-row button { margin-top: 0; padding: 7px 14px; font-size: 13px; }
  .approve { background: #1a7a4c; }
  .reject { background: #a3490e; }
  .error { color: #a3490e; background: #fbe9df; border: 1px solid #a3490e;
           border-radius: 8px; padding: 12px 16px; }
  .workspace { font-family: ui-monospace, monospace; font-size: 11px; color: #516170;
               background: #e6ebf0; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
</style>
</head>
<body>
<nav>
  <a href="/new">+ New change</a>
  <a href="/queue">Review queue</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
